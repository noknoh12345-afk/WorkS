name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16.4*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project BookScan.xcodeproj \
            -scheme BookScan \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|Sendable)|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/BookScan.app

      - name: Show errors
        if: failure()
        run: grep -E "error:" -A3 build.log | head -200 || true

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BookScan.app Payload/
          ldid -S Payload/BookScan.app/BookScan || true
          zip -qry BookScan.ipa Payload
          ls -lh BookScan.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BookScan-ipa
          path: BookScan.ipa

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BookScan.ipa \
            --title "本スキャン (最新ビルド)" \
            --notes "コミット ${GITHUB_SHA::7} からの自動ビルド（未署名IPA）。Sideloadly / AltStore / TrollStore などで導入してください。" \
            --prerelease
